name: Build

on:
  push:
    tags:
      - 'v*.*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          output="tproxy-server-${GOOS}-${GOARCH}"

          if [ "${GOOS}" = "windows" ]; then
            output="${output}.exe"
          fi

          go build -trimpath -o "${output}" ./cmd/tproxy-server

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tproxy-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: tproxy-server-*
